# Drop this file into a consumer repo as `.github/workflows/secrets-scan.yml`.
# Replace `<sha>` and `<vX.Y.Z>` with the latest ci-templates release —
# Dependabot will then keep them fresh.
#
# Pre-requisites at the org level:
#  1. `GITLEAKS_LICENSE` secret (free for orgs at https://gitleaks.io).
#  2. The org's "Allow accessing actions in private repos" toggle is on
#     (Settings → Actions → General → Access). Only needed if both
#     ci-templates and the consumer are private.

name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 08:00 UTC daily — full-history safety-net scan against main.
    - cron: '0 8 * * *'

permissions:
  contents: read
  pull-requests: write    # gitleaks-action's PR comment
  security-events: write  # SARIF upload to Code Scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    uses: aris-space/ci-templates/.github/workflows/secrets-scan.yml@<sha> # <vX.Y.Z>
    secrets: inherit
