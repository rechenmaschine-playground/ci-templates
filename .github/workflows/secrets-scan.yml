name: Secrets scan

# Reusable workflow that scans full git history with gitleaks and uploads
# findings to the GitHub Code Scanning Security tab. Each consuming repo
# in the org calls this once from its main CI workflow:
#
#   secrets-scan:
#     uses: <org>/ci-templates/.github/workflows/secrets-scan.yml@<sha>
#     secrets: inherit
#
# Architecture:
#  - On `pull_request` events: gitleaks-action runs first to post the
#    standard PR comment when a leak is found in the diff (best UX).
#  - On all events: a separate full-history scan with the gitleaks CLI
#    runs, marked authoritative for pass/fail. This catches leaks that
#    were force-merged into main: gitleaks-action's incremental scan
#    uses `--first-parent --no-merges` and silently misses merge commits.
#
# Submodules are deliberately not fetched — by org policy each repo
# runs its own scan.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. Override with `self-hosted` once an org runner exists.
        type: string
        default: ubuntu-latest
      gitleaks-version:
        description: gitleaks CLI version used for the authoritative full-history scan.
        type: string
        default: '8.30.1'
    secrets:
      GITLEAKS_LICENSE:
        required: true

permissions:
  contents: read
  # gitleaks-action's PR comment posting (essential on private repos
  # without GitHub Advanced Security where the Code Scanning bot can't run).
  pull-requests: write
  # SARIF upload to the Code Scanning Security tab (best-effort).
  security-events: write

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # PR-comment UX: gitleaks-action posts an inline comment when a
      # leak is found in the PR diff. Skipped on push/schedule events
      # because it has no PR to comment on AND its incremental scan
      # would miss merge commits anyway.
      - if: github.event_name == 'pull_request'
        continue-on-error: true   # authoritative pass/fail is the next step
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          ver="${{ inputs.gitleaks-version }}"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_${os}_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Authoritative full-history scan. This is the step whose pass/fail
      # decides the workflow's outcome. Honors .gitleaksignore in the repo.
      - name: Full-history scan
        run: |
          gitleaks detect \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif

      # Upload SARIF to Code Scanning when available. Best-effort: the API
      # returns 403 on private repos without GitHub Advanced Security.
      - if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@865f5f5c36632f18690a3d569fa0a764f2da0c3e # v3
        with:
          sarif_file: results.sarif
          category: gitleaks
