name: Secrets scan

# Reusable workflow that scans full git history with gitleaks and uploads
# findings to the GitHub Code Scanning Security tab. Each consuming repo
# in the org calls this once from its main CI workflow:
#
#   secrets-scan:
#     uses: <org>/ci-templates/.github/workflows/secrets-scan.yml@<sha>
#     secrets: inherit
#
# Submodules are deliberately not fetched — by org policy each repo
# runs its own scan.
#
# By default, gitleaks-action's push-event scan uses
# `--log-opts=--no-merges --first-parent <base>^..<head>` for performance,
# which silently misses merge commits (a force-merged PR's leak slips
# past the post-merge main scan). To close that gap on push and schedule
# events, we set BASE_REF to the second commit of history so the scan
# range becomes `<root>..<head>` = full history. PR events keep the
# default base (first commit of the PR) so the action's PR comment only
# mentions leaks actually introduced by that PR.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. Override with `self-hosted` once an org runner exists.
        type: string
        default: ubuntu-latest
    secrets:
      GITLEAKS_LICENSE:
        required: true

permissions:
  contents: read
  # gitleaks-action's PR comment posting (essential on private repos
  # without GitHub Advanced Security where the Code Scanning bot can't run).
  pull-requests: write
  # SARIF upload to the Code Scanning Security tab (best-effort).
  security-events: write

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # On push and schedule events: force a full-history scan by setting
      # BASE_REF to the second commit of history. gitleaks-action computes
      # `${BASE_REF}^..${HEAD}` so that becomes `<root>..<HEAD>`. PR events
      # keep the default (PR's base..head) so PR comments stay focused on
      # the diff being reviewed.
      - if: github.event_name != 'pull_request'
        name: Compute BASE_REF for full-history scan
        run: |
          set -euo pipefail
          second=$(git rev-list --reverse HEAD | sed -n '2p')
          if [[ -z "$second" ]]; then
            echo "Repo has fewer than 2 commits — full-history scan trick skipped." >&2
            exit 0
          fi
          echo "BASE_REF=$second" >> "$GITHUB_ENV"

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ github.token }}

      # gitleaks-action only attaches SARIF as a workflow artifact; this
      # step pushes it to the Code Scanning API so findings populate the
      # Security tab when that feature is available (public repos, or
      # private with GHAS). Best-effort: continue-on-error tolerates the
      # 403 you get on private repos without GHAS so this doesn't block CI.
      - if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@865f5f5c36632f18690a3d569fa0a764f2da0c3e # v3
        with:
          sarif_file: results.sarif
          category: gitleaks
