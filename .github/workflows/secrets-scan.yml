name: secrets-scan

# Reusable workflow that scans full git history with gitleaks and uploads
# findings to the GitHub Code Scanning Security tab. Each consuming repo
# in the org calls this once from its main CI workflow — see
# `templates/consumer.yml` in this repo for a paste-ready starting point.
#
# Submodules are deliberately not fetched — by org policy each repo
# runs its own scan.
#
# Why the BASE_REF dance below: gitleaks-action's push-event scan uses
# `--log-opts=--no-merges --first-parent <base>^..<head>` for performance.
# That silently misses merge commits, so a force-merged PR's leak slips
# past the post-merge main scan. We force a full-history scan on push
# and schedule events by overriding BASE_REF (gitleaks-action picks it up
# at src/index.js:165-168 and src/gitleaks.js:175-177). PR events keep
# the default base so the action's PR comment stays scoped to the diff
# under review.
#
# CAVEAT: BASE_REF isn't documented in gitleaks-action's README — only
# in source. Treat it as semi-private API. When Dependabot opens a PR
# bumping gitleaks-action, re-verify BASE_REF still behaves as expected
# before merging.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. Override with `self-hosted` once an org runner exists.
        type: string
        default: ubuntu-latest
    secrets:
      GITLEAKS_LICENSE:
        required: true

permissions:
  contents: read
  # gitleaks-action's PR comment posting. Note: this is only load-bearing
  # on private repos without GitHub Advanced Security. On public repos
  # and private+GHAS, the github-advanced-security bot already comments,
  # so the gitleaks-action comment is redundant. If aris ever buys GHAS
  # for all private repos, this whole workflow + license + BASE_REF
  # workaround becomes redundant — collapse to native Code Scanning.
  pull-requests: write
  # SARIF upload to the Code Scanning Security tab (best-effort).
  security-events: write

jobs:
  scan:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # On push and schedule events (anything that isn't a PR): force a
      # full-history scan by pointing BASE_REF at the second commit of
      # history. gitleaks-action's hardcoded `${BASE_REF}^..${HEAD}`
      # range then becomes `<root>..<HEAD>` = full history.
      - if: github.event_name == 'push' || github.event_name == 'schedule'
        name: Compute BASE_REF for full-history scan
        run: |
          set -euo pipefail
          second=$(git rev-list --reverse HEAD | sed -n '2p')
          if [[ -z "$second" ]]; then
            echo "Repo has fewer than 2 commits — full-history override skipped." >&2
            exit 0
          fi
          echo "BASE_REF=$second" >> "$GITHUB_ENV"

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ github.token }}

      # gitleaks-action only attaches SARIF as a workflow artifact; this
      # step pushes it to the Code Scanning API so findings populate the
      # Security tab when that feature is available (public repos, or
      # private with GHAS). Best-effort: continue-on-error tolerates the
      # 403 you get on private repos without GHAS so this doesn't block CI.
      - if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@865f5f5c36632f18690a3d569fa0a764f2da0c3e # v3
        with:
          sarif_file: results.sarif
          category: gitleaks
