name: Secrets scan

# Reusable workflow that scans full git history with gitleaks and uploads
# findings to the GitHub Code Scanning Security tab. Each consuming repo
# in the org calls this once from its main CI workflow:
#
#   secrets-scan:
#     uses: <org>/ci-templates/.github/workflows/secrets-scan.yml@<sha>
#     secrets: inherit
#
# Pre-requisite: org must have a `GITLEAKS_LICENSE` secret set (free for
# orgs at https://gitleaks.io). Submodules are deliberately not fetched
# — by org policy each repo runs its own scan.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. Override with `self-hosted` once an org runner exists.
        type: string
        default: ubuntu-latest
    secrets:
      GITLEAKS_LICENSE:
        required: true

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ github.token }}
      # gitleaks-action only attaches SARIF as a workflow artifact — it does
      # not populate the Code Scanning Security tab. This step pushes the
      # SARIF to the Code Scanning API so findings show up there. Runs even
      # if gitleaks failed (so the leak is visible in the Security tab).
      - if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@865f5f5c36632f18690a3d569fa0a764f2da0c3e # v3
        with:
          sarif_file: results.sarif
          category: gitleaks
